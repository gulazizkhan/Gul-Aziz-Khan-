<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="admin"><p class="eyebrow">ADMIN</p><h1>Contact Messages</h1>{% if messages %}<div class="table"><table><tr><th>Date</th><th>Name</th><th>Email</th><th>Subject</th><th>Message</th></tr>{% for m in messages %}<tr><td>{{m.date}}</td><td>{{m.name}}</td><td>{{m.email}}</td><td>{{m.subject}}</td><td>{{m.message}}</td></tr>{% endfor %}</table></div>{% else %}<p>No messages yet.</p>{% endif %}<br><a class="btn" href="/">← Back</a></main></body></html>
